name: Validate All JSON Files

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Find and validate all JSON files using pathlib (Strict compliance)
        run: |
          python3 -c "
          from pathlib import Path
          import json
          import sys

          def main() -> None:
              failed = False
              print('Inizio scansione di tutti i file JSON nel repository...')

              for file_path in Path('.').rglob('*.json'):
                  if '.git' in file_path.parts:
                      continue
                  
                  print(f'Analizzando: {file_path} ... ', end='')
                  try:
                      with file_path.open('r', encoding='utf-8') as f:
                          json.load(f)
                      print('OK')
                  except (json.JSONDecodeError, OSError) as e:
                      print(f'ERRORE!\n  Dettagli: {e}')
                      failed = True

              if failed:
                  print('\n[Fallito] Uno o più file JSON contengono errori di sintassi.')
                  sys.exit(1)
              else:
                  print('\n[Successo] Tutti i file JSON trovati sono formattati correttamente.')

          if __name__ == '__main__':
              main()
          "
