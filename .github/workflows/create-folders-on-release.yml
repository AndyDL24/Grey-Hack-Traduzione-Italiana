name: Create Folders and Release Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_path:
        description: "Path to the source file"
        required: true
        default: "[Nightly] Grey Hack/custom_lang.json"

jobs:
  create-folders-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version file
        id: read_version
        run: |
          VERSION_FILE="[Nightly] Grey Hack/version"
          if [ -f "$VERSION_FILE" ]; then
            VERSION=$(cat "$VERSION_FILE" | tr -d '[:space:]')
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Verify source path
        run: |
          SOURCE_FILE="${{ github.event.inputs.source_path }}"
          if [ -z "$SOURCE_FILE" ]; then
            SOURCE_FILE="[Nightly] Grey Hack/custom_lang.json"
          fi
          
          if [ ! -f "$SOURCE_FILE" ]; then
            echo "Error: Source file does not exist: $SOURCE_FILE"
            exit 1
          fi
          echo "SOURCE_FILE=$SOURCE_FILE" >> $GITHUB_ENV

      - name: Create directories and prepare file structure in repository
        run: |
          mkdir -p "Appdata/LocalLow/Loading Home/Grey Hack/Translation"
          cp "$SOURCE_FILE" "Appdata/LocalLow/Loading Home/Grey Hack/Translation/custom_lang.json"

      - name: Commit and push folder changes to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update translation folders for release version ${{ steps.read_version.outputs.version }}"
          branch: main
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Prepare ZIP package structure
        run: |
          # Crea una cartella temporanea pulita per lo zip
          mkdir -p package_temp
          
          # Copia la struttura delle cartelle e il file custom_lang.json
          mkdir -p package_temp/AppData/LocalLow/"Loading Home"/"Grey Hack"/Translation
          cp "$SOURCE_FILE" package_temp/AppData/LocalLow/"Loading Home"/"Grey Hack"/Translation/custom_lang.json
          
          # Copia README, LICENSE e VERSION nella radice dello zip (se presenti)
          [ -f README.md ] && cp README.md package_temp/
          [ -f LICENSE ] && cp LICENSE package_temp/
          [ -f "[Nightly] Grey Hack/version" ] && cp "[Nightly] Grey Hack/version" package_temp/VERSION

          # Crea l'archivio ZIP finale partendo dalla cartella temporanea
          cd package_temp
          zip -r "../Grey-Hack-Italian-Translation-${{ steps.read_version.outputs.version }}.zip" .
          cd ..

      - name: Upload ZIP asset and generate release notes
        uses: softprops/action-gh-release@v2
        with:
          files: Grey-Hack-Italian-Translation-${{ steps.read_version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
